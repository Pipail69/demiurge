<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demiurge — carte du monde</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font-family: monospace; font-size: 13px; }

      .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #555; }
    </style>
  </head>
  <body>
    <p id="status">génération du monde…</p>
    <main>
      <canvas id="map" width="512" height="512"></canvas>
      <ul id="legend"></ul>
